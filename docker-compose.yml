services:
  # Nuxt 前端应用
  web:
    image: academy-nuxt:v1
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    container_name: renhotec-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=${API_BASE:-http://localhost:90000/api}
